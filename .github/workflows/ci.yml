name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kidsathi
          POSTGRES_USER: kidsathi
          POSTGRES_PASSWORD: kidsathi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kidsathi"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kidsathi:kidsathi@localhost:5432/kidsathi
      DJANGO_SECRET_KEY: ci-secret
      SMS_BACKEND: locmem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for PDF invoices
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-core
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kidsathi-api .
